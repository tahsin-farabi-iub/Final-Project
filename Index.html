<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <header class="site-header">
        <h2>Welcome to Meal Finder</h2>
        <p class="tagline">Search recipes from around the world</p>
    </header>
    <main>
    <section class="search-bar">
      <input type="text" id="searchInput"><br><br>
      <button id="searchBtn" onclick="search()">Search</button><br><br>

    <section id="resultsContainer" class="results-grid"></section> <br>
    <button id="showAllBtn" class="show-all-btn" onclick="showAllMeals()">Show All Results</button>
    </main>
    <footer class="site-footer">
        <p>Recipes from <a href="https://www.themealdb.com/">TheMealDB</a></p>

    </footer>
